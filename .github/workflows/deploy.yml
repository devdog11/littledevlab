name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Only main deploys. A manual run started from any other branch is skipped.
    if: github.ref == 'refs/heads/main'
    # The Cloudflare secrets live in this environment, which only main can use.
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the products page
        working-directory: app
        run: |
          npm ci
          npm run build

      # The React build is the products page. The old static products.html stays
      # in the repo for rollback but is no longer published. To roll back, revert
      # the commit that made this change.
      - name: Stage public content
        run: |
          mkdir -p _public
          cp index.html build-log.html _public/
          cp app/dist/index.html _public/products.html
          cp -R app/dist/assets _public/assets
          cp -R images lab-notes build-log _public/
          test -s _public/products.html
          grep -q 'id="root"' _public/products.html
          ls _public/assets/*.js _public/assets/*.css
          
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stay on Wrangler 4.x so a new major version can't change deploys unannounced.
          wranglerVersion: "4"
          command: pages deploy _public --project-name=littledevlab --branch=main --commit-dirty=true
