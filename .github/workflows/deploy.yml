name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Only main deploys. A manual run started from any other branch is skipped.
    if: github.ref == 'refs/heads/main'
    # The Cloudflare secrets live in this environment, which only main can use.
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the attribution check can read every pushed commit.
          fetch-depth: 0

      # Blocks the deploy if a pushed commit credits an AI tool. A manual run has
      # no push range, so it skips this check.
      - name: Check commit attribution
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            tools/check-attribution.sh "${{ github.sha }}^!"
          else
            tools/check-attribution.sh "$before..${{ github.sha }}"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build the products page
        working-directory: app
        run: |
          npm ci
          npm run build

      # The React build is published as products.html.
      - name: Stage public content
        run: |
          mkdir -p _public
          cp index.html build-log.html _public/
          cp app/dist/index.html _public/products.html
          cp -R app/dist/assets _public/assets
          cp -R images lab-notes build-log _public/
          test -s _public/products.html
          grep -q 'id="root"' _public/products.html
          ls _public/assets/*.js _public/assets/*.css
          
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stay on Wrangler 4.x so a new major version can't change deploys unannounced.
          wranglerVersion: "4"
          command: pages deploy _public --project-name=littledevlab --branch=main --commit-dirty=true
