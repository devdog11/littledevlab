name: PR checks

# Lint and build every pull request into main, so a green check shows the site
# builds before I merge. This job never deploys and has no Cloudflare access.
on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Lint and build the products page
        working-directory: app
        run: |
          npm ci
          npm run lint
          npm run build

      # Same staging step as deploy.yml, so a missing file fails here first.
      - name: Stage public content
        run: |
          mkdir -p _public
          cp index.html build-log.html _public/
          cp app/dist/index.html _public/products.html
          cp -R app/dist/assets _public/assets
          cp -R images lab-notes build-log _public/
          test -s _public/products.html
          grep -q 'id="root"' _public/products.html
          ls _public/assets/*.js _public/assets/*.css
