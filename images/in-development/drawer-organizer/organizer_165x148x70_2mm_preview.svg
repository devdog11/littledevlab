<g font-size="12.5" fill="#2c2820">
<text x="40" y="600">Solid volume 106,968 mm³, against 132,888 mm³ for the same box with unperforated 2 mm walls.</text>
<text x="40" y="619">The diamond pattern uses approximately 19.5% less solid volume than the unperforated version.</text>
<text x="40" y="638">Internal opening 161 × 144 mm; internal usable height 68 mm; exterior corners square.</text>
<text x="40" y="657">60 openings: 16 front, 16 back, 14 left, 14 right, in two rows on centrelines 19.5 mm and 51.5 mm.</text>
<text x="40" y="676">6 mm of solid material below the lower row, 5 mm between the rows, 5 mm above the upper row. Corners, top rim, bottom perimeter and floor are unbroken.</text>
</g>
