<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Courier New', ui-monospace, SFMono-Regular, Menlo, monospace">
  <style>
    .sheet-bg { fill: #f3ede1; }
    .frame { fill: none; stroke: #2c2820; stroke-width: 2; }
    .edge-solid { fill: none; stroke: #2c2820; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
    .edge-hidden { fill: none; stroke: #a49a82; stroke-width: 1.6; stroke-dasharray: 6 5; stroke-linecap: round; }
    .ext-line { stroke: #6b6454; stroke-width: 1; }
    .dim-line { stroke: #6b6454; stroke-width: 1; }
    .tick { stroke: #6b6454; stroke-width: 1.4; }
    .center-mark { stroke: #b0492a; stroke-width: 1.2; }
    .dim-text { fill: #55503f; font-size: 12px; letter-spacing: .01em; }
    .eyebrow { fill: #b0492a; font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .heading { fill: #2c2820; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
    .tb-label { fill: #55503f; font-size: 8.5px; letter-spacing: .08em; }
    .tb-value { fill: #2c2820; font-size: 11.5px; font-weight: 600; }
    .tb-border { fill: none; stroke: #2c2820; stroke-width: 1.4; }
  </style>

  <rect x="0" y="0" width="560" height="460" class="sheet-bg"/>
  <rect x="14" y="14" width="532" height="432" class="frame"/>

